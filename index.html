<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080d18;
color:#eef3ff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{
max-width:760px;
margin:auto;
padding:16px 14px 80px
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
font-weight:700;
color:white;
background:#4e8cff;
cursor:pointer
}

button.danger{
background:#3a1820;
color:#ff9baa
}

button.secondary{
background:#17233b
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.logo{
font-size:22px;
font-weight:800
}

.logo span{
color:#4e8cff
}

.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-bottom:12px
}

.nav button{
background:#111a2d;
color:#8996b4
}

.nav button.active{
background:#4e8cff;
color:white
}

.page{
display:none
}

.page.active{
display:block
}

.card{
background:#111a2d;
border:1px solid #26334f;
border-radius:15px;
padding:14px;
margin-bottom:10px
}

.card h3{
margin:0 0 12px
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.stat{
background:#111a2d;
border:1px solid #26334f;
border-radius:15px;
padding:13px
}

.stat small{
color:#8996b4;
font-size:11px
}

.stat strong{
display:block;
font-size:23px;
margin-top:5px
}

.green{
color:#35d58a
}

.red{
color:#ff6378
}

.muted{
color:#8996b4
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.field{
margin-bottom:9px
}

label{
display:block;
font-size:11px;
color:#8996b4;
margin-bottom:5px
}

input,select,textarea{
width:100%;
padding:11px;
border-radius:9px;
border:1px solid #26334f;
background:#0c1425;
color:#eef3ff;
font-size:14px
}

textarea{
min-height:80px
}

.account{
display:flex;
gap:8px;
margin-bottom:12px
}

.account select{
flex:1
}

.money{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.money div{
background:#17233b;
padding:11px;
border-radius:10px
}

.money small{
display:block;
font-size:10px;
color:#8996b4
}

.money strong{
display:block;
margin-top:4px
}

table{
width:100%;
border-collapse:collapse;
font-size:12px
}

th,td{
padding:8px 5px;
border-bottom:1px solid #26334f;
text-align:left;
white-space:nowrap
}

th{
color:#8996b4
}

.table-wrap{
overflow:auto
}

.empty{
text-align:center;
padding:25px;
color:#8996b4
}

.actions{
display:flex;
gap:4px
}

.actions button{
padding:6px 8px
}

.checks{
display:flex;
flex-wrap:wrap;
gap:5px
}

.check{
background:#0c1425;
border:1px solid #26334f;
border-radius:8px;
padding:7px 8px;
font-size:11px;
color:#eef3ff
}

.check input{
width:auto
}

canvas{
width:100%;
height:180px;
background:#0c1425;
border-radius:10px
}

@media(min-width:650px){
.stats{
grid-template-columns:repeat(4,1fr)
}
}
</style>
</head>

<body>

<main>

<div class="top">

<div class="logo">
Trade<span>Journal</span> Pro
</div>

<button id="quickTrade">
＋ Trade
</button>

</div>


<!-- CONTA -->

<div class="account">

<select id="accountSelect"></select>

<button id="addAccount">
＋ Conta
</button>

</div>


<!-- MENU -->

<div class="nav">

<button class="active" data-page="dashboard">
Dashboard
</button>

<button data-page="register">
Registrar
</button>

<button data-page="trades">
Trades
</button>

</div>


<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="stats">

<div class="stat">
<small>TRADES</small>
<strong id="totalTrades">0</strong>
</div>

<div class="stat">
<small>WIN RATE</small>
<strong id="winRate">0%</strong>
</div>

<div class="stat">
<small>RESULTADO</small>
<strong id="totalR">0R</strong>
</div>

<div class="stat">
<small>PROFIT FACTOR</small>
<strong id="profitFactor">0</strong>
</div>

</div>


<div class="card">

<h3>💰 Financeiro</h3>

<div class="money">

<div>
<small>CAPITAL INICIAL</small>
<strong id="initialCapital">$0</strong>
</div>

<div>
<small>RESULTADO</small>
<strong id="moneyResult">$0</strong>
</div>

<div>
<small>CAPITAL ATUAL</small>
<strong id="currentCapital">$0</strong>
</div>

</div>

</div>


<div class="card">

<h3>⚙️ Configuração</h3>

<div class="row">

<div class="field">

<label>Moeda</label>

<select id="currency">

<option value="USD">USD — Dólar</option>

<option value="JPY">JPY — Iene</option>

</select>

</div>

<div class="field">

<label>Capital inicial</label>

<input
id="capital"
type="number"
step="0.01"
placeholder="500">
</div>

</div>

<button id="saveConfig">
Salvar configuração
</button>

</div>


<div class="card">

<h3>📈 Equity Curve</h3>

<canvas id="chart"></canvas>

</div>


<div class="card">

<h3>🏆 Setups</h3>

<div id="setupStats"></div>

</div>

</section>


<!-- REGISTRAR -->

<section id="register" class="page">

<div class="card">

<h3>📝 Novo Trade</h3>

<form id="tradeForm">

<div class="row">

<div class="field">

<label>Ativo</label>

<select id="asset">

<option>XAUUSD</option>
<option>US100</option>
<option>BTC</option>
<option>ETH</option>
<option>SOL</option>
<option>Outro</option>

</select>

</div>


<div class="field">

<label>Direção</label>

<select id="side">

<option>Compra</option>
<option>Venda</option>

</select>

</div>

</div>


<div class="row">

<div class="field">

<label>Setup</label>

<select id="setup">

<option>BOS + Reteste</option>
<option>Sweep + BOS</option>
<option>BOS + FVG</option>
<option>FVG</option>
<option>Order Block</option>
<option>Wyckoff</option>
<option>Divergência RSI</option>
<option>Outro</option>

</select>

</div>


<div class="field">

<label>Timeframe</label>

<select id="timeframe">

<option>1m</option>
<option>5m</option>
<option>15m</option>
<option>1H</option>

</select>

</div>

</div>


<div class="row">

<div class="field">

<label>Sessão</label>

<select id="session">

<option>Ásia</option>
<option>Londres</option>
<option>Nova York</option>
<option>Londres/NY</option>

</select>

</div>


<div class="field">

<label>Resultado (R)</label>

<input
id="r"
type="number"
step="0.1"
placeholder="+2 ou -1"
required>

</div>

</div>


<div class="row">

<div class="field">

<label>Plano</label>

<select id="plan">

<option>Sim</option>
<option>Não</option>

</select>

</div>


<div class="field">

<label>Resultado financeiro</label>

<input
id="moneyValue"
type="number"
step="0.01"
placeholder="Ex: 25 ou -15">

</div>

</div>


<div class="field">

<label>Condições</label>

<div class="checks">

<label class="check">
<input type="checkbox" value="Liquidez">
Liquidez
</label>

<label class="check">
<input type="checkbox" value="BOS">
BOS
</label>

<label class="check">
<input type="checkbox" value="FVG">
FVG
</label>

<label class="check">
<input type="checkbox" value="OB">
OB
</label>

<label class="check">
<input type="checkbox" value="Volume">
Volume
</label>

<label class="check">
<input type="checkbox" value="Pavio">
Pavio
</label>

</div>

</div>


<div class="field">

<label>Observação</label>

<textarea
id="note"
placeholder="Como foi a operação?"></textarea>

</div>


<button type="submit">
💾 Salvar Trade
</button>

</form>

</div>

</section>


<!-- TRADES -->

<section id="trades" class="page">

<div class="card">

<h3>📋 Trades registrados</h3>

<div id="tradeList"></div>

</div>


<div class="card">

<button
id="deleteAll"
class="danger">
Apagar todos os trades
</button>

</div>

</section>

</main>


<script>

/* =========================
   BANCO
========================= */

const KEY =
"TRADE_JOURNAL_PRO_V3";


let database =
JSON.parse(
localStorage.getItem(KEY) || "null"
);


if(!database){

database = {

accounts:[

{
id:1,
name:"Conta 1",
currency:"USD",
capital:0,
trades:[]
},

{
id:2,
name:"Conta 2",
currency:"USD",
capital:0,
trades:[]
}

],

current:1

};

saveDatabase();

}


function saveDatabase(){

localStorage.setItem(
KEY,
JSON.stringify(database)
);

}


function account(){

return database.accounts.find(
a => a.id === database.current
);

}


function trades(){

return account().trades;

}


/* =========================
   MOEDA
========================= */

function money(value){

const a =
account();

if(a.currency === "JPY"){

return "¥" +
Math.round(value)
.toLocaleString("ja-JP");

}

return "$" +
Number(value)
.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* =========================
   NAVEGAÇÃO
========================= */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(
p => p.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(
b =>
b.classList.toggle(
"active",
b.dataset.page === id
)
);

render();

}


/* =========================
   CONTAS
========================= */

function renderAccounts(){

const select =
document.getElementById(
"accountSelect"
);

select.innerHTML =
database.accounts.map(
a =>
`<option value="${a.id}">
${a.name}
</option>`
).join("");

select.value =
database.current;

}


document
.getElementById("accountSelect")
.addEventListener(
"change",
function(){

database.current =
Number(this.value);

saveDatabase();

render();

}
);


document
.getElementById("addAccount")
.addEventListener(
"click",
function(){

const name =
prompt(
"Nome da nova conta:"
);

if(!name){

return;

}

const id =
Date.now();

database.accounts.push({

id:id,

name:name,

currency:"USD",

capital:0,

trades:[]

});

database.current =
id;

saveDatabase();

render();

alert(
"Conta criada!"
);

}
);


/* =========================
   REGISTRO
========================= */

document
.getElementById("tradeForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();

const trade = {

id:Date.now(),

date:
new Date()
.toLocaleDateString("pt-BR"),

asset:
document.getElementById("asset").value,

side:
document.getElementById("side").value,

setup:
document.getElementById("setup").value,

timeframe:
document.getElementById("timeframe").value,

session:
document.getElementById("session").value,

r:
Number(
document.getElementById("r").value
),

money:
Number(
document.getElementById(
"moneyValue"
).value || 0
),

plan:
document.getElementById("plan").value,

note:
document.getElementById("note").value

};

trades().unshift(trade);

saveDatabase();

this.reset();

alert(
"Trade salvo com sucesso!"
);

showPage("dashboard");

}
);


/* =========================
   CONFIGURAÇÃO
========================= */

document
.getElementById("saveConfig")
.addEventListener(
"click",
function(){

const a =
account();

a.currency =
document.getElementById(
"currency"
).value;

a.capital =
Number(
document.getElementById(
"capital"
).value || 0
);

saveDatabase();

render();

alert(
"Configuração salva!"
);

}
);


/* =========================
   APAGAR TRADE
========================= */

function deleteTrade(id){

const a =
account();

const trade =
a.trades.find(
t => t.id === id
);

if(!trade){

return;

}

if(
!confirm(
"Apagar este trade?"
)
){

return;

}

a.trades =
a.trades.filter(
t => t.id !== id
);

saveDatabase();

render();

}


/* =========================
   APAGAR TODOS
========================= */

document
.getElementById("deleteAll")
.addEventListener(
"click",
function(){

if(!trades().length){

return;

}

if(
!confirm(
"Apagar TODOS os trades desta conta?"
)
){

return;

}

account().trades = [];

saveDatabase();

render();

}
);


/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

const list =
trades();

const total =
list.length;

const wins =
list.filter(
t => t.r > 0
).length;

const losses =
list.filter(
t => t.r < 0
);

const totalR =
list.reduce(
(s,t) => s + t.r,
0
);

const winRate =
total
?
wins / total * 100
:
0;

const grossWins =
list
.filter(t => t.r > 0)
.reduce(
(s,t) => s+t.r,
0
);

const grossLoss =
Math.abs(
losses.reduce(
(s,t) => s+t.r,
0
)
);

const pf =
grossLoss
?
grossWins/grossLoss
:
0;


document.getElementById(
"totalTrades"
).textContent =
total;


document.getElementById(
"winRate"
).textContent =
winRate.toFixed(1)+"%";


const rEl =
document.getElementById(
"totalR"
);

rEl.textContent =
(totalR >= 0 ? "+" : "") +
totalR.toFixed(1)+"R";

rEl.className =
totalR >= 0
?
"green"
:
"red";


document.getElementById(
"profitFactor"
).textContent =
pf
?
pf.toFixed(2)
:
"0";


const a =
account();

const financial =
list.reduce(
(s,t) =>
s + Number(t.money || 0),
0
);

const current =
Number(a.capital || 0)
+
financial;


document.getElementById(
"initialCapital"
).textContent =
money(a.capital || 0);


document.getElementById(
"moneyResult"
).textContent =
(financial >= 0 ? "+" : "") +
money(Math.abs(financial));


document.getElementById(
"currentCapital"
).textContent =
money(current);


document.getElementById(
"currency"
).value =
a.currency;


document.getElementById(
"capital"
).value =
a.capital || "";


renderSetups();

drawChart();

}


/* =========================
   SETUPS
========================= */

function renderSetups(){

const box =
document.getElementById(
"setupStats"
);

const groups = {};

trades().forEach(
t => {

if(!groups[t.setup]){
groups[t.setup] = [];
}

groups[t.setup].push(t);

}
);

const keys =
Object.keys(groups);

if(!keys.length){

box.innerHTML =
'<div class="empty">Sem trades ainda.</div>';

return;

}

box.innerHTML =
keys.map(
key => {

const list =
groups[key];

const r =
list.reduce(
(s,t) => s+t.r,
0
);

return `

<div style="margin-bottom:10px">

<div style="
display:flex;
justify-content:space-between;
font-size:12px">

<span>${key}</span>

<b class="${
r >= 0 ? "green" : "red"
}">

${r >= 0 ? "+" : ""}
${r.toFixed(1)}R

</b>

</div>

</div>

`;

}
).join("");

}


/* =========================
   LISTA
========================= */

function renderTrades(){

const box =
document.getElementById(
"tradeList"
);

const list =
trades();

if(!list.length){

box.innerHTML =
'<div class="empty">Nenhum trade registrado.</div>';

return;

}

box.innerHTML = `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Data</th>
<th>Ativo</th>
<th>Setup</th>
<th>R</th>
<th>Dinheiro</th>
<th></th>

</tr>

</thead>

<tbody>

${

list.map(
t => `

<tr>

<td>${t.date}</td>

<td>${t.asset}</td>

<td>${t.setup}</td>

<td class="${
t.r >= 0
?
"green"
:
"red"
}">

${t.r >= 0 ? "+" : ""}
${t.r}R

</td>

<td class="${
t.money >= 0
?
"green"
:
"red"
}">

${t.money >= 0 ? "+" : ""}
${money(t.money)}

</td>

<td>

<div class="actions">

<button
class="danger"
onclick="deleteTrade(${t.id})">

🗑️

</button>

</div>

</td>

</tr>

`
).join("")

}

</tbody>

</table>

</div>

`;

}


/* =========================
   GRÁFICO
========================= */

function drawChart(){

const canvas =
document.getElementById(
"chart"
);

const ctx =
canvas.getContext("2d");

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;

canvas.width =
width;

canvas.height =
height;

ctx.clearRect(
0,
0,
width,
height
);

const list =
trades();

if(!list.length){

return;

}

let values = [0];

let total = 0;

list
.slice()
.reverse()
.forEach(
t => {

total += t.r;

values.push(total);

}
);

const min =
Math.min(...values);

const max =
Math.max(...values);

const range =
max-min || 1;

ctx.strokeStyle =
"#4e8cff";

ctx.lineWidth = 3;

ctx.beginPath();

values.forEach(
(v,i) => {

const x =
i /
(values.length-1 || 1)
*
width;

const y =
height -
(
(v-min)/range
*
height*.8
) -
height*.1;

if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}
);

ctx.stroke();

}


/* =========================
   RENDER
========================= */

function render(){

renderAccounts();

renderDashboard();

renderTrades();

}


/* =========================
   BOTÃO RÁPIDO
========================= */

document
.getElementById("quickTrade")
.addEventListener(
"click",
function(){

showPage("register");

}
);


/* =========================
   MENU
========================= */

document
.querySelectorAll(".nav button")
.forEach(
button => {

button.addEventListener(
"click",
function(){

showPage(
this.dataset.page
);

}
);

}
);


/* =========================
   INICIAR
========================= */

render();

</script>

</body>
</html>
