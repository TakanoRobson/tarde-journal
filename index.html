<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="manifest.json">
<title>Trade Journal Pro</title>

<style>
:root{
--bg:#080d18;
--card:#111a2d;
--card2:#17233b;
--text:#eef3ff;
--muted:#8996b4;
--line:#26334f;
--blue:#4e8cff;
--green:#35d58a;
--red:#ff6378;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{
max-width:760px;
margin:auto;
padding:16px 14px 90px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:12px
}

.logo{
font-weight:850;
font-size:22px
}

.logo b{
color:var(--blue)
}

button{
border:0;
border-radius:12px;
padding:11px 14px;
font-weight:750;
color:white;
background:var(--blue);
cursor:pointer
}

.secondary{
background:var(--card2)
}

.danger{
background:#3a1820;
color:#ff9baa
}

.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-bottom:12px
}

.nav button{
background:var(--card);
color:var(--muted)
}

.nav button.on{
background:var(--blue);
color:white
}

.view{
display:none
}

.view.on{
display:block
}

.account{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:10px;
margin-bottom:12px
}

.account-row{
display:flex;
align-items:center;
gap:8px
}

.account-row select{
flex:1
}

.account-info{
font-size:11px;
color:var(--muted);
margin-top:7px
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px
}

.stat,.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:14px
}

.stat small{
color:var(--muted);
font-size:11px
}

.stat strong{
display:block;
font-size:24px;
margin-top:4px
}

.green{color:var(--green)}
.red{color:var(--red)}
.muted{color:var(--muted)}

.card{
margin-top:10px
}

.card h3{
margin:0 0 11px;
font-size:15px
}

form{
display:grid;
gap:9px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.field label{
display:block;
color:var(--muted);
font-size:11px;
margin-bottom:5px
}

input,select,textarea{
width:100%;
border:1px solid var(--line);
background:#0c1425;
color:var(--text);
border-radius:10px;
padding:11px;
font-size:14px
}

textarea{
min-height:75px
}

.checks{
display:flex;
flex-wrap:wrap;
gap:6px
}

.check{
border:1px solid var(--line);
background:#0c1425;
padding:8px 9px;
border-radius:9px;
font-size:12px
}

.check input{
width:auto
}

.bar{
margin:10px 0
}

.barhead{
display:flex;
justify-content:space-between;
font-size:12px
}

.track{
height:9px;
background:#202b43;
border-radius:10px;
margin-top:5px;
overflow:hidden
}

.fill{
height:100%;
border-radius:10px
}

table{
width:100%;
border-collapse:collapse;
font-size:12px
}

th,td{
text-align:left;
padding:9px 5px;
border-bottom:1px solid var(--line);
white-space:nowrap
}

th{
color:var(--muted)
}

.filters{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.empty{
text-align:center;
padding:25px;
color:var(--muted)
}

canvas{
width:100%;
height:180px;
background:#0c1425;
border-radius:12px
}

.action{
padding:7px 9px;
margin-right:4px
}

.install{
display:none;
width:100%;
margin-bottom:10px
}

@media(min-width:650px){
.stats{
grid-template-columns:repeat(4,1fr)
}
}
</style>
</head>

<script>

/* ==============================
   BANCO DE DADOS
============================== */

const ACCOUNT_KEY = 'trade_journal_accounts_v22';

const OLD_KEY = 'tjp_v2';

let accounts = [];

let currentAccountId = null;


/* ==============================
   FUNÇÕES DE DADOS
============================== */

function loadData(){

    const saved =
        localStorage.getItem(ACCOUNT_KEY);

    if(saved){

        try{

            accounts = JSON.parse(saved);

        }catch(error){

            accounts = [];

        }

    }


    /*
       Se não existem contas,
       cria Conta 1 e Conta 2.
    */

    if(
        !Array.isArray(accounts) ||
        accounts.length === 0
    ){

        let oldTrades = [];

        try{

            oldTrades =
                JSON.parse(
                    localStorage.getItem(OLD_KEY) || '[]'
                );

        }catch(error){

            oldTrades = [];

        }


        accounts = [

            {
                id:'account1',
                name:'Conta 1',
                trades:
                    Array.isArray(oldTrades)
                    ? oldTrades
                    : []
            },

            {
                id:'account2',
                name:'Conta 2',
                trades:[]
            }

        ];

        saveData();

    }


    const savedAccount =
        localStorage.getItem(
            'trade_journal_current_account'
        );


    if(
        savedAccount &&
        accounts.some(
            account =>
                account.id === savedAccount
        )
    ){

        currentAccountId =
            savedAccount;

    }else{

        currentAccountId =
            accounts[0].id;

    }


    localStorage.setItem(
        'trade_journal_current_account',
        currentAccountId
    );

}


function saveData(){

    localStorage.setItem(
        ACCOUNT_KEY,
        JSON.stringify(accounts)
    );

}


function currentAccount(){

    return accounts.find(
        account =>
            account.id === currentAccountId
    );

}


function currentTrades(){

    const account =
        currentAccount();

    if(!account){

        return [];

    }

    if(
        !Array.isArray(account.trades)
    ){

        account.trades = [];

    }

    return account.trades;

}


/* ==============================
   NAVEGAÇÃO
============================== */

function showView(viewId){

    document
        .querySelectorAll('.view')
        .forEach(
            section =>
                section.classList.remove('on')
        );


    const target =
        document.getElementById(viewId);


    if(target){

        target.classList.add('on');

    }


    document
        .querySelectorAll('.nav button')
        .forEach(
            button =>
                button.classList.toggle(
                    'on',
                    button.dataset.view === viewId
                )
        );


    render();

}


/* ==============================
   CONTAS
============================== */

function renderAccounts(){

    const select =
        document.getElementById(
            'accountSelect'
        );


    select.innerHTML =
        accounts.map(
            account =>

            `<option value="${account.id}">
                ${escapeText(account.name)}
            </option>`

        ).join('');


    select.value =
        currentAccountId;


    const account =
        currentAccount();


    document.getElementById(
        'accountInfo'
    ).textContent =

        account
        ?
        'Conta ativa: ' +
        account.name +
        ' · ' +
        currentTrades().length +
        ' trade(s)'
        :
        '';

}


function changeAccount(){

    currentAccountId =
        document.getElementById(
            'accountSelect'
        ).value;


    localStorage.setItem(
        'trade_journal_current_account',
        currentAccountId
    );


    render();

}


function createAccount(){

    let name =
        prompt(
            'Nome da nova conta:',
            'Conta ' + (accounts.length + 1)
        );


    if(name === null){

        return;

    }


    name =
        name.trim();


    if(!name){

        alert(
            'Digite um nome para a conta.'
        );

        return;

    }


    const account = {

        id:
            'account_' +
            Date.now(),

        name:name,

        trades:[]

    };


    accounts.push(account);


    currentAccountId =
        account.id;


    saveData();


    localStorage.setItem(
        'trade_journal_current_account',
        currentAccountId
    );


    render();


    alert(
        'Conta criada com sucesso!'
    );

}


/* ==============================
   ESCAPE
============================== */

function escapeText(value){

    return String(
        value === undefined ||
        value === null
        ? ''
        : value
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ==============================
   ESTATÍSTICAS
============================== */

function stats(trades){

    const wins =
        trades.filter(
            trade =>
                Number(trade.r) > 0
        );


    const losses =
        trades.filter(
            trade =>
                Number(trade.r) < 0
        );


    const grossWin =
        wins.reduce(
            (sum,trade) =>
                sum + Number(trade.r),
            0
        );


    const grossLoss =
        Math.abs(
            losses.reduce(
                (sum,trade) =>
                    sum + Number(trade.r),
                0
            )
        );


    const result =
        trades.reduce(
            (sum,trade) =>
                sum + Number(trade.r),
            0
        );


    return {

        count:
            trades.length,

        winRate:
            trades.length
            ?
            wins.length /
            trades.length *
            100
            :
            0,

        result:result,

        profitFactor:
            grossLoss
            ?
            grossWin / grossLoss
            :
            0

    };

}


/* ==============================
   GRUPOS
============================== */

function groupBy(trades,key){

    const groups = {};


    trades.forEach(
        trade => {

            const value =
                trade[key] ||
                'Outro';


            if(!groups[value]){

                groups[value] = [];

            }


            groups[value].push(trade);

        }
    );


    return groups;

}


/* ==============================
   BARRAS
============================== */

function renderBars(elementId,groups){

    const element =
        document.getElementById(
            elementId
        );


    const entries =
        Object.entries(groups);


    if(entries.length === 0){

        element.innerHTML =
            '<div class="empty">Sem dados ainda.</div>';

        return;

    }


    let max =
        Math.max(
            1,
            ...entries.map(
                item =>
                    Math.abs(
                        stats(item[1]).result
                    )
            )
        );


    element.innerHTML =

        entries
        .sort(
            (a,b) =>
                stats(b[1]).result -
                stats(a[1]).result
        )
        .map(
            item => {

                const name = item[0];

                const result =
                    stats(item[1]);


                const width =
                    Math.min(
                        100,
                        Math.abs(
                            result.result
                        ) /
                        max *
                        100
                    );


                return `

                    <div class="bar">

                        <div class="barhead">

                            <span>
                                ${escapeText(name)}
                            </span>

                            <b class="${
                                result.result >= 0
                                ? 'green'
                                : 'red'
                            }">

                                ${
                                    result.result > 0
                                    ? '+'
                                    : ''
                                }

                                ${result.result.toFixed(1)}R

                                ·

                                ${result.winRate.toFixed(0)}%

                            </b>

                        </div>


                        <div class="track">

                            <div
                                class="fill"
                                style="
                                    width:${width}%;
                                    background:${
                                        result.result >= 0
                                        ? 'var(--green)'
                                        : 'var(--red)'
                                    };
                                "
                            ></div>

                        </div>

                    </div>

                `;

            }
        )
        .join('');

}


/* ==============================
   DASHBOARD
============================== */

function renderDashboard(){

    const trades =
        currentTrades();


    const result =
        stats(trades);


    document.getElementById('n')
        .textContent =
        result.count;


    document.getElementById('wr')
        .textContent =
        result.winRate.toFixed(1) +
        '%';


    const resultElement =
        document.getElementById('rr');


    resultElement.textContent =
        (result.result >= 0 ? '+' : '') +
        result.result.toFixed(1) +
        'R';


    resultElement.className =
        result.result >= 0
        ? 'green'
        : 'red';


    document.getElementById('pf')
        .textContent =
        result.profitFactor
        ?
        result.profitFactor.toFixed(2)
        :
        '0';


    renderBars(
        'setupBars',
        groupBy(trades,'setup')
    );


    renderBars(
        'assetBars',
        groupBy(trades,'asset')
    );


    renderBars(
        'sessionBars',
        groupBy(trades,'session')
    );


    const outsidePlan =
        trades.filter(
            trade =>
                trade.plan === 'Não'
        ).length;


    document.getElementById(
        'discipline'
    ).innerHTML =

        `Seguiu o plano:
        <b class="green">
        ${
            trades.length
            ?
            (
                (trades.length-outsidePlan) /
                trades.length *
                100
            ).toFixed(1)
            :
            0
        }%
        </b>

        <br>

        <span class="muted">
        ${outsidePlan}
        trade(s) fora do plano
        </span>`;


    drawChart();

}


/* ==============================
   GRÁFICO
============================== */

function drawChart(){

    const canvas =
        document.getElementById(
            'chart'
        );


    const context =
        canvas.getContext('2d');


    const ratio =
        window.devicePixelRatio || 1;


    const width =
        canvas.clientWidth *
        ratio;


    const height =
        canvas.clientHeight *
        ratio;


    canvas.width =
        width;


    canvas.height =
        height;


    context.clearRect(
        0,
        0,
        width,
        height
    );


    const trades =
        currentTrades();


    if(trades.length === 0){

        return;

    }


    let values = [0];

    let total = 0;


    trades
        .slice()
        .reverse()
        .forEach(
            trade => {

                total +=
                    Number(trade.r);

                values.push(total);

            }
        );


    const min =
        Math.min(...values);


    const max =
        Math.max(...values);


    const range =
        max - min || 1;


    context.strokeStyle =
        '#4e8cff';

    context.lineWidth = 3;

    context.beginPath();


    values.forEach(
        (value,index) => {

            const x =
                index /
                (values.length - 1 || 1) *
                width;


            const y =
                height -
                (
                    (value-min) /
                    range
                ) *
                height *
                0.8 -
                height *
                0.1;


            if(index === 0){

                context.moveTo(x,y);

            }else{

                context.lineTo(x,y);

            }

        }
    );


    context.stroke();

}


/* ==============================
   FILTROS
============================== */

function renderFilters(){

    const trades =
        currentTrades();


    const configs = [

        {
            id:'filterAsset',
            key:'asset',
            label:'Todos os ativos'
        },

        {
            id:'filterSetup',
            key:'setup',
            label:'Todos os setups'
        },

        {
            id:'filterSession',
            key:'session',
            label:'Todas as sessões'
        }

    ];


    configs.forEach(
        config => {

            const select =
                document.getElementById(
                    config.id
                );


            const current =
                select.value;


            const values =
                [
                    ...new Set(
                        trades.map(
                            trade =>
                                trade[config.key]
                        )
                    )
                ];


            select.innerHTML =
                `<option value="">
                    ${config.label}
                </option>` +

                values.map(
                    value =>
                        `<option value="${escapeText(value)}">
                            ${escapeText(value)}
                        </option>`
                ).join('');


            select.value =
                values.includes(current)
                ? current
                : '';

        }
    );

}


/* ==============================
   TABELA
============================== */

function renderTable(){

    const trades =
        currentTrades();


    const assetFilter =
        document.getElementById(
            'filterAsset'
        ).value;


    const setupFilter =
        document.getElementById(
            'filterSetup'
        ).value;


    const sessionFilter =
        document.getElementById(
            'filterSession'
        ).value;


    const planFilter =
        document.getElementById(
            'filterPlan'
        ).value;


    const filtered =
        trades.filter(
            trade =>

                (!assetFilter ||
                    trade.asset === assetFilter)

                &&

                (!setupFilter ||
                    trade.setup === setupFilter)

                &&

                (!sessionFilter ||
                    trade.session === sessionFilter)

                &&

                (!planFilter ||
                    trade.plan === planFilter)

        );


    const table =
        document.getElementById(
            'table'
        );


    if(filtered.length === 0){

        table.innerHTML =
            '<div class="empty">Nenhum trade.</div>';

        return;

    }


    table.innerHTML =

        `<div style="overflow:auto">

            <table>

                <tr>

                    <th>Data</th>
                    <th>Ativo</th>
                    <th>Setup</th>
                    <th>R</th>
                    <th>Plano</th>
                    <th>Ações</th>

                </tr>

                ${
                    filtered.map(
                        trade => `

                        <tr>

                            <td>
                                ${escapeText(trade.date)}
                            </td>

                            <td>
                                ${escapeText(trade.asset)}
                            </td>

                            <td>
                                ${escapeText(trade.setup)}
                            </td>

                            <td class="${
                                Number(trade.r) > 0
                                ? 'green'
                                : Number(trade.r) < 0
                                ? 'red'
                                : ''
                            }">

                                ${
                                    Number(trade.r) > 0
                                    ? '+'
                                    : ''
                                }

                                ${Number(trade.r).toFixed(1)}R

                            </td>

                            <td>
                                ${escapeText(trade.plan)}
                            </td>

                            <td>

                                <button
                                    class="secondary action"
                                    data-edit="${trade.id}">
                                    ✏️
                                </button>

                                <button
                                    class="danger action"
                                    data-delete="${trade.id}">
                                    🗑️
                                </button>

                            </td>

                        </tr>

                        `
                    ).join('')
                }

            </table>

        </div>`;

}


/* ==============================
   RENDER GERAL
============================== */

function render(){

    renderAccounts();

    renderDashboard();

    renderFilters();

    renderTable();

}


/* ==============================
   SALVAR TRADE
============================== */

function saveTrade(event){

    event.preventDefault();


    const rInput =
        document.getElementById('r');


    if(rInput.value === ''){

        alert(
            'Digite o resultado em R.'
        );

        return;

    }


    const account =
        currentAccount();


    if(!account){

        alert(
            'Nenhuma conta selecionada.'
        );

        return;

    }


    const conditions =

        Array
        .from(
            document.querySelectorAll(
                '.check input:checked'
            )
        )
        .map(
            input =>
                input.value
        );


    const trade = {

        id:
            String(Date.now()),

        date:
            new Date()
            .toISOString()
            .slice(0,10),

        asset:
            document.getElementById(
                'asset'
            ).value,

        side:
            document.getElementById(
                'side'
            ).value,

        setup:
            document.getElementById(
                'setup'
            ).value,

        tf:
            document.getElementById(
                'tf'
            ).value,

        session:
            document.getElementById(
                'session'
            ).value,

        r:
            Number(rInput.value),

        plan:
            document.getElementById(
                'plan'
            ).value,

        money:
            Number(
                document.getElementById(
                    'money'
                ).value || 0
            ),

        conditions:
            conditions,

        note:
            document.getElementById(
                'note'
            ).value

    };


    account.trades.unshift(
        trade
    );


    saveData();


    document.getElementById(
        'tradeForm'
    ).reset();


    alert(
        'Trade salvo com sucesso!'
    );


    showView('dash');

}


/* ==============================
   EDITAR TRADE
============================== */

function editTrade(id){

    const trades =
        currentTrades();


    const trade =
        trades.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!trade){

        alert(
            'Trade não encontrado.'
        );

        return;

    }


    const newR =
        prompt(
            'Resultado em R:',
            trade.r
        );


    if(newR === null){

        return;

    }


    const numericR =
        Number(newR);


    if(!Number.isFinite(numericR)){

        alert(
            'Digite um número válido.'
        );

        return;

    }


    const newNote =
        prompt(
            'Observação:',
            trade.note || ''
        );


    if(newNote !== null){

        trade.note =
            newNote;

    }


    trade.r =
        numericR;


    saveData();


    render();


    alert(
        'Trade atualizado!'
    );

}


/* ==============================
   EXCLUIR TRADE
============================== */

function deleteTrade(id){

    const account =
        currentAccount();


    if(!account){

        return;

    }


    const trade =
        account.trades.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!trade){

        alert(
            'Trade não encontrado.'
        );

        return;

    }


    const confirmed =
        confirm(

            'Excluir este trade?\n\n' +

            trade.date +
            ' · ' +
            trade.asset +
            ' · ' +

            (
                Number(trade.r) > 0
                ? '+'
                : ''
            ) +

            trade.r +
            'R'

        );


    if(!confirmed){

        return;

    }


    account.trades =
        account.trades.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveData();


    render();


    alert(
        'Trade excluído.'
    );

}


/* ==============================
   APAGAR TODOS
============================== */

function wipe(){

    const account =
        currentAccount();


    if(!account){

        return;

    }


    if(account.trades.length === 0){

        alert(
            'Esta conta não possui trades.'
        );

        return;

    }


    const confirmed =
        confirm(

            'ATENÇÃO!\n\n' +

            'Apagar todos os trades da conta "' +
            account.name +
            '"?\n\n' +

            'Esta ação não pode ser desfeita.'

        );


    if(!confirmed){

        return;

    }


    account.trades = [];


    saveData();


    render();


    alert(
        'Todos os trades foram apagados.'
    );

}


/* ==============================
   BACKUP
============================== */

function exportBackup(){

    const backup = {

        version:'2.2',

        exportedAt:
            new Date()
            .toISOString(),

        accounts:accounts

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:'application/json'
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement('a');


    link.href = url;

    link.download =
        'trade-journal-backup.json';


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}

   EVENTOS
============================== */

document

                    showView(

    );

document

    );

    );


/* Salvar */

document
    .getElementById('tradeForm')
    .addEventListener(

    );

[
    'filterAsset',
    'filterSetup',
    'filterSession',
    'filterPlan'
]
.forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                'change',
                renderTable
            );

    }
);


/* Botões da tabela */

document
    .getElementById('table')
    .addEventListener(
        'click',
        function(event){

            const editButton =
                event.target.closest(
                    '[data-edit]'
                );


            const deleteButton =
                event.target.closest(
                    '[data-delete]'
                );


            if(editButton){

                editTrade(
                    editButton.dataset.edit
                );

                return;

            }


            if(deleteButton){

                deleteTrade(
                    deleteButton.dataset.delete
                );

            }

        }
    );


/* Backup */

document
    .getElementById('exportButton')
    .addEventListener(
        'click',
        exportBackup
    );


/* Apagar tudo */

document
    .getElementById('wipeButton')
    .addEventListener(
        'click',
        wipe
    );


/* ==============================
   INSTALAÇÃO PWA
============================== */

let deferredPrompt = null;


window.addEventListener(
    'beforeinstallprompt',
    function(event){

        event.preventDefault();

        deferredPrompt =
            event;


        const button =
            document.getElementById(
                'install'
            );


        button.style.display =
            'block';


        button.addEventListener(
            'click',
            async function(){

                if(!deferredPrompt){

                    return;

                }


                deferredPrompt.prompt();

                deferredPrompt = null;

            }
        );

    }
);


/* ==============================
   INICIAR
============================== */

loadData();

render();

</script>
