<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="manifest.json">
<title>Trade Journal Pro</title>

<style>
:root{
--bg:#080d18;
--card:#111a2d;
--card2:#17233b;
--text:#eef3ff;
--muted:#8996b4;
--line:#26334f;
--blue:#4e8cff;
--green:#35d58a;
--red:#ff6378;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{
max-width:760px;
margin:auto;
padding:16px 14px 90px
}

button{
border:0;
border-radius:12px;
padding:11px 14px;
font-weight:750;
color:white;
background:var(--blue);
cursor:pointer
}

.secondary{
background:var(--card2)
}

.danger{
background:#3a1820;
color:#ff9baa
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px
}

.logo{
font-weight:850;
font-size:22px
}

.logo b{
color:var(--blue)
}

.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-bottom:12px
}

.nav button{
background:var(--card);
color:var(--muted)
}

.nav button.on{
background:var(--blue);
color:white
}

.view{
display:none
}

.view.on{
display:block
}

.account{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:10px;
margin-bottom:12px
}

.account-row{
display:flex;
gap:8px;
align-items:center
}

.account-row select{
flex:1
}

.account-info{
font-size:11px;
color:var(--muted);
margin-top:7px
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px
}

.stat,.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:14px
}

.stat small{
color:var(--muted);
font-size:11px
}

.stat strong{
display:block;
font-size:24px;
margin-top:4px
}

.card{
margin-top:10px
}

.card h3{
margin:0 0 11px;
font-size:15px
}

.green{
color:var(--green)
}

.red{
color:var(--red)
}

.muted{
color:var(--muted)
}

.money-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px
}

.money-card{
background:var(--card2);
border-radius:12px;
padding:12px
}

.money-card small{
display:block;
color:var(--muted);
font-size:10px
}

.money-card strong{
display:block;
font-size:19px;
margin-top:5px
}

.settings{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

form{
display:grid;
gap:9px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.field label{
display:block;
color:var(--muted);
font-size:11px;
margin-bottom:5px
}

input,select,textarea{
width:100%;
border:1px solid var(--line);
background:#0c1425;
color:var(--text);
border-radius:10px;
padding:11px;
font-size:14px
}

textarea{
min-height:75px
}

.checks{
display:flex;
flex-wrap:wrap;
gap:6px
}

.check{
border:1px solid var(--line);
background:#0c1425;
padding:8px 9px;
border-radius:9px;
font-size:12px
}

.check input{
width:auto
}

.bar{
margin:10px 0
}

.barhead{
display:flex;
justify-content:space-between;
font-size:12px
}

.track{
height:9px;
background:#202b43;
border-radius:10px;
margin-top:5px;
overflow:hidden
}

.fill{
height:100%;
border-radius:10px
}

canvas{
width:100%;
height:180px;
background:#0c1425;
border-radius:12px
}

.filters{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

table{
width:100%;
border-collapse:collapse;
font-size:12px
}

th,td{
text-align:left;
padding:9px 5px;
border-bottom:1px solid var(--line);
white-space:nowrap
}

th{
color:var(--muted)
}

.empty{
text-align:center;
padding:25px;
color:var(--muted)
}

.action{
padding:7px 9px;
margin-right:3px
}

.install{
display:none;
width:100%;
margin-bottom:10px
}

@media(min-width:650px){

.stats{
grid-template-columns:repeat(4,1fr)
}

}
</style>
</head>

<script>

/* ==============================
   BANCO DE DADOS
============================== */

const DATABASE_KEY = "tradeJournalV23";

let accounts = [];

let currentAccountId = null;


/* ==============================
   CARREGAR DADOS
============================== */

function loadDatabase(){

const saved =
localStorage.getItem(DATABASE_KEY);


if(saved){

try{

accounts =
JSON.parse(saved);

}catch(error){

accounts = [];

}

}


/* IMPORTAR V2 ANTIGA */

if(
!Array.isArray(accounts) ||
accounts.length === 0
){

let oldTrades = [];

try{

oldTrades =
JSON.parse(
localStorage.getItem("tjp_v2") || "[]"
);

}catch(error){

oldTrades = [];

}


accounts = [

{
id:"account1",
name:"Conta 1",
currency:"USD",
initialCapital:0,
trades:
Array.isArray(oldTrades)
? oldTrades
: []
},

{
id:"account2",
name:"Conta 2",
currency:"USD",
initialCapital:0,
trades:[]
}

];


saveDatabase();

}


const oldAccount =
localStorage.getItem(
"currentTradeAccount"
);


if(
oldAccount &&
accounts.some(
a => a.id === oldAccount
)
){

currentAccountId =
oldAccount;

}else{

currentAccountId =
accounts[0].id;

}


localStorage.setItem(
"currentTradeAccount",
currentAccountId
);

}


/* ==============================
   SALVAR BANCO
============================== */

function saveDatabase(){

localStorage.setItem(
DATABASE_KEY,
JSON.stringify(accounts)
);

}


/* ==============================
   CONTA ATUAL
============================== */

function getAccount(){

return accounts.find(
account =>
account.id === currentAccountId
);

}


function getTrades(){

const account =
getAccount();


if(!account){

return [];

}


if(!Array.isArray(account.trades)){

account.trades = [];

}


return account.trades;

}


/* ==============================
   MOEDA
============================== */

function getCurrencySymbol(){

const account =
getAccount();


if(
account &&
account.currency === "JPY"
){

return "¥";

}


return "$";

}


function formatMoney(value){

const number =
Number(value || 0);


if(
getCurrencySymbol() === "¥"
){

return "¥" +
Math.round(number)
.toLocaleString("ja-JP");

}


return "$" +
number.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* ==============================
   ESTATÍSTICAS
============================== */

function calculateStats(trades){

const wins =
trades.filter(
trade =>
Number(trade.r) > 0
);

const losses =
trades.filter(
trade =>
Number(trade.r) < 0
);


const grossWins =
wins.reduce(
(sum,trade) =>
sum + Number(trade.r),
0
);


const grossLosses =
Math.abs(
losses.reduce(
(sum,trade) =>
sum + Number(trade.r),
0
)
);


const totalR =
trades.reduce(
(sum,trade) =>
sum + Number(trade.r),
0
);


return {

trades:trades.length,

winRate:
trades.length
?
wins.length /
trades.length *
100
:
0,

totalR:totalR,

profitFactor:
grossLosses
?
grossWins /
grossLosses
:
0

};

}


/* ==============================
   NAVEGAÇÃO
============================== */

function openView(id){

document
.querySelectorAll(".view")
.forEach(
view =>
view.classList.remove("on")
);


const target =
document.getElementById(id);


if(target){

target.classList.add("on");

}


document
.querySelectorAll(".nav button")
.forEach(
button =>
button.classList.toggle(
"on",
button.dataset.view === id
)
);


render();

}


/* ==============================
   CONTAS
============================== */

function renderAccounts(){

const select =
document.getElementById(
"accountSelect"
);


select.innerHTML =
accounts.map(
account =>

`<option value="${account.id}">
${escapeHTML(account.name)}
</option>`

).join("");


select.value =
currentAccountId;


const account =
getAccount();


if(account){

document.getElementById(
"accountInfo"
).textContent =

"Conta ativa: " +
account.name +
" · " +
getTrades().length +
" trade(s)";

}

}


function switchAccount(){

currentAccountId =
document.getElementById(
"accountSelect"
).value;


localStorage.setItem(
"currentTradeAccount",
currentAccountId
);


render();

}


function createAccount(){

let name =
prompt(
"Nome da nova conta:",
"Conta " + (accounts.length + 1)
);


if(name === null){

return;

}


name =
name.trim();


if(!name){

alert(
"Digite um nome."
);

return;

}


const newAccount = {

id:
"account_" +
Date.now(),

name:name,

currency:"USD",

initialCapital:0,

trades:[]

};


accounts.push(newAccount);

currentAccountId =
newAccount.id;


saveDatabase();


localStorage.setItem(
"currentTradeAccount",
currentAccountId
);


render();

}


/* ==============================
   DASHBOARD
============================== */

function renderDashboard(){

const trades =
getTrades();


const stats =
calculateStats(trades);


document.getElementById(
"totalTrades"
).textContent =
stats.trades;


document.getElementById(
"winRate"
).textContent =
stats.winRate.toFixed(1) + "%";


const rElement =
document.getElementById(
"rResult"
);


rElement.textContent =
(stats.totalR >= 0 ? "+" : "") +
stats.totalR.toFixed(1) +
"R";


rElement.className =
stats.totalR >= 0
? "green"
: "red";


document.getElementById(
"profitFactor"
).textContent =
stats.profitFactor
?
stats.profitFactor.toFixed(2)
:
"0";


const account =
getAccount();


const initial =
Number(
account.initialCapital || 0
);


const result =
trades.reduce(
(sum,trade) =>
sum + Number(trade.money || 0),
0
);


const current =
initial + result;


document.getElementById(
"initialCapital"
).textContent =
formatMoney(initial);


const resultElement =
document.getElementById(
"financialResult"
);


resultElement.textContent =
(result >= 0 ? "+" : "") +
formatMoney(Math.abs(result));


resultElement.className =
result >= 0
? "green"
: "red";


document.getElementById(
"currentCapital"
).textContent =
formatMoney(current);


document.getElementById(
"currencySelect"
).value =
account.currency || "USD";


document.getElementById(
"capitalInput"
).value =
account.initialCapital || "";


renderBars(
"setupBars",
groupTrades("setup")
);


renderBars(
"assetBars",
groupTrades("asset")
);


renderBars(
"sessionBars",
groupTrades("session")
);


const outsidePlan =
trades.filter(
trade =>
trade.plan === "Não"
).length;


document.getElementById(
"discipline"
).innerHTML =

"Seguiu o plano: " +

`<b class="green">${
trades.length
?
(
(trades.length-outsidePlan) /
trades.length *
100
).toFixed(1)
:
0
}%</b>` +

`<br><span class="muted">
${outsidePlan} trade(s) fora do plano
</span>`;


drawChart();

}


/* ==============================
   GRUPOS
============================== */

function groupTrades(key){

const groups = {};


getTrades().forEach(
trade => {

const value =
trade[key] || "Outro";


if(!groups[value]){

groups[value] = [];

}


groups[value].push(trade);

}
);


return groups;

}


/* ==============================
   BARRAS
============================== */

function renderBars(elementId,groups){

const element =
document.getElementById(
elementId
);


const entries =
Object.entries(groups);


if(!entries.length){

element.innerHTML =
'<div class="empty">Sem dados ainda.</div>';

return;

}


const maximum =
Math.max(
1,
...entries.map(
entry =>
Math.abs(
calculateStats(entry[1]).totalR
)
)
;


element.innerHTML =

entries
.sort(
(a,b) =>
calculateStats(b[1]).totalR -
calculateStats(a[1]).totalR
)
.map(
entry => {

const name =
entry[0];


const stats =
calculateStats(entry[1]);


const width =
Math.min(
100,
Math.abs(stats.totalR) /
maximum *
100
);


return `

<div class="bar">

<div class="barhead">

<span>
${escapeHTML(name)}
</span>

<b class="${
stats.totalR >= 0
? "green"
: "red"
}">

${stats.totalR > 0 ? "+" : ""}
${stats.totalR.toFixed(1)}R

·

${stats.winRate.toFixed(0)}%

</b>

</div>

<div class="track">

<div
class="fill"
style="
width:${width}%;
background:${
stats.totalR >= 0
? "var(--green)"
: "var(--red)"
};
">
</div>

</div>

</div>

`;

}
)
.join("");

}


/* ==============================
   GRÁFICO
============================== */

function drawChart(){

const canvas =
document.getElementById(
"equityChart"
);


const ctx =
canvas.getContext("2d");


const ratio =
window.devicePixelRatio || 1;


const width =
canvas.clientWidth * ratio;


const height =
canvas.clientHeight * ratio;


canvas.width =
width;


canvas.height =
height;


ctx.clearRect(
0,
0,
width,
height
);


const trades =
getTrades();


if(!trades.length){

return;

}


let values = [0];

let total = 0;


trades
.slice()
.reverse()
.forEach(
trade => {

total +=
Number(trade.r);

values.push(total);

}
);


const min =
Math.min(...values);


const max =
Math.max(...values);


const range =
max - min || 1;


ctx.strokeStyle =
"#4e8cff";

ctx.lineWidth = 3;

ctx.beginPath();


values.forEach(
(value,index) => {

const x =
index /
(values.length - 1 || 1) *
width;


const y =
height -
(
(value-min) /
range
) *
height *
0.8 -
height *
0.1;


if(index === 0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}
);


ctx.stroke();

}


/* ==============================
   FILTROS
============================== */

function renderFilters(){

const trades =
getTrades();


fillFilter(
"filterAsset",
"asset",
"Todos os ativos"
);


fillFilter(
"filterSetup",
"setup",
"Todos os setups"
);


fillFilter(
"filterSession",
"session",
"Todas as sessões"
);

}


function fillFilter(id,key,defaultText){

const select =
document.getElementById(id);


const current =
select.value;


const values =
[
...new Set(
getTrades()
.map(
trade =>
trade[key]
)
.filter(Boolean)
)
];


select.innerHTML =
`<option value="">
${defaultText}
</option>` +

values.map(
value =>
`<option value="${escapeHTML(value)}">
${escapeHTML(value)}
</option>`
).join("");


select.value =
values.includes(current)
? current
: "";

}


/* ==============================
   TABELA
============================== */

function renderTable(){

const assetFilter =
document.getElementById(
"filterAsset"
).value;


const setupFilter =
document.getElementById(
"filterSetup"
).value;


const sessionFilter =
document.getElementById(
"filterSession"
).value;


const planFilter =
document.getElementById(
"filterPlan"
).value;


const trades =
getTrades().filter(
trade =>

(!assetFilter ||
trade.asset === assetFilter)

&&

(!setupFilter ||
trade.setup === setupFilter)

&&

(!sessionFilter ||
trade.session === sessionFilter)

&&

(!planFilter ||
trade.plan === planFilter)
);


const table =
document.getElementById(
"tradeTable"
);


if(!trades.length){

table.innerHTML =
'<div class="empty">Nenhum trade.</div>';

return;

}


table.innerHTML =

`<div style="overflow:auto">

<table>

<tr>

<th>Data</th>
<th>Ativo</th>
<th>Setup</th>
<th>R</th>
<th>Dinheiro</th>
<th>Plano</th>
<th>Ações</th>

</tr>

${
trades.map(
trade => `

<tr>

<td>
${escapeHTML(trade.date)}
</td>

<td>
${escapeHTML(trade.asset)}
</td>

<td>
${escapeHTML(trade.setup)}
</td>

<td class="${
Number(trade.r) > 0
? "green"
: Number(trade.r) < 0
? "red"
: ""
}">

${Number(trade.r) > 0 ? "+" : ""}
${Number(trade.r).toFixed(1)}R

</td>

<td class="${
Number(trade.money) > 0
? "green"
: Number(trade.money) < 0
? "red"
: ""
}">

${Number(trade.money) > 0 ? "+" : ""}
${formatMoney(trade.money || 0)}

</td>

<td>
${escapeHTML(trade.plan)}
</td>

<td>

<button
class="secondary action"
data-edit="${trade.id}">
✏️
</button>

<button
class="danger action"
data-delete="${trade.id}">
🗑️
</button>

</td>

</tr>

`
).join("")
}

</table>

</div>`;

}


/* ==============================
   SALVAR TRADE
============================== */

function submitTrade(event){

event.preventDefault();


const rInput =
document.getElementById(
"rValue"
);


if(rInput.value === ""){

alert(
"Digite o resultado em R."
);

return;

}


const conditions =
Array.from(
document.querySelectorAll(
".check input:checked"
)
)
.map(
input =>
input.value
);


const trade = {

id:
String(Date.now()),

date:
new Date()
.toISOString()
.slice(0,10),

asset:
document.getElementById(
"asset"
).value,

side:
document.getElementById(
"side"
).value,

setup:
document.getElementById(
"setup"
).value,

tf:
document.getElementById(
"timeframe"
).value,

session:
document.getElementById(
"session"
).value,

r:
Number(
rInput.value
),

plan:
document.getElementById(
"plan"
).value,

money:
Number(
document.getElementById(
"moneyValue"
).value || 0
),

conditions:
conditions,

note:
document.getElementById(
"note"
).value

};


getTrades().unshift(
trade
);


saveDatabase();


document.getElementById(
"tradeForm"
).reset();


alert(
"Trade salvo com sucesso!"
);


openView("dash");

}


/* ==============================
   EDITAR TRADE
============================== */

function editTrade(id){

const trade =
getTrades().find(
item =>
String(item.id) === String(id)
);


if(!trade){

return;

}


const newR =
prompt(
"Resultado em R:",
trade.r
);


if(newR === null){

return;

}


const r =
Number(newR);


if(!Number.isFinite(r)){

alert(
"Valor inválido."
);

return;

}


const newMoney =
prompt(
"Resultado financeiro:",
trade.money || 0
);


if(newMoney === null){

return;

}


const money =
Number(newMoney);


if(!Number.isFinite(money)){

alert(
"Valor inválido."
);

return;

}


trade.r = r;

trade.money = money;


saveDatabase();


render();

}


/* ==============================
   APAGAR UM TRADE
============================== */

function deleteTrade(id){

const account =
getAccount();


const trade =
account.trades.find(
item =>
String(item.id) === String(id)
);


if(!trade){

return;

}


const confirmDelete =
confirm(

"Excluir este trade?\n\n" +

trade.date +
" · " +
trade.asset +
"\n" +

(
Number(trade.r) >= 0
? "+"
: ""
) +

trade.r +
"R"

);


if(!confirmDelete){

return;

}


account.trades =
account.trades.filter(
item =>
String(item.id) !== String(id)
);


saveDatabase();


render();

}


/* ==============================
   APAGAR TODOS
============================== */

function deleteAll(){

const account =
getAccount();


if(!account.trades.length){

alert(
"Não há trades nesta conta."
);

return;

}


if(
!confirm(
"Tem certeza que deseja apagar TODOS os trades desta conta?"
)
){

return;

}


account.trades = [];


saveDatabase();


render();

}


/* ==============================
   CONFIGURAÇÃO
============================== */

function saveSettings(){

const account =
getAccount();


account.currency =
document.getElementById(
"currencySelect"
).value;


account.initialCapital =
Number(
document.getElementById(
"capitalInput"
).value || 0
);


saveDatabase();


render();


alert(
"Configuração salva!"
);

}


/* ==============================
   BACKUP
============================== */

function createBackup(){

const backup = {

version:"2.3",

date:
new Date().toISOString(),

accounts:accounts

};


const blob =
new Blob(
[
JSON.stringify(
backup,
null,
2
)
],
{
type:"application/json"
}
);


const url =
URL.createObjectURL(blob);


const a =
document.createElement("a");


a.href = url;

a.download =
"trade-journal-backup.json";


a.click();


URL.revokeObjectURL(url);

}


/* ==============================
   SEGURANÇA HTML
============================== */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==============================
   RENDER PRINCIPAL
============================== */

function render(){

renderAccounts();

renderDashboard();

renderFilters();

renderTable();

}


/* ==============================
   EVENTOS
============================== */


/* MENU */

document
.querySelectorAll(".nav button")
.forEach(
button => {

button.addEventListener(
"click",
function(){

openView(
this.dataset.view
);

}
);

}
);


/* BOTÃO + TRADE */

document
.getElementById(
"newTradeButton"
)
.addEventListener(
"click",
function(){

openView("new");

}
);


/* CONTAS */

document
.getElementById(
"accountSelect"
)
.addEventListener(
"change",
switchAccount
);


document
.getElementById(
"newAccountButton"
)
.addEventListener(
"click",
createAccount
);


/* SALVAR TRADE */

document
.getElementById(
"tradeForm"
)
.addEventListener(
"submit",
submitTrade
);


/* CONFIGURAÇÃO */

document
.getElementById(
"saveSettingsButton"
)
.addEventListener(
"click",
saveSettings
);


/* FILTROS */

[
"filterAsset",
"filterSetup",
"filterSession",
"filterPlan"
]
.forEach(
id => {

document
.getElementById(id)
.addEventListener(
"change",
renderTable
);

}
);


/* EDITAR / APAGAR */

document
.getElementById(
"tradeTable"
)
.addEventListener(
"click",
function(event){

const edit =
event.target.closest(
"[data-edit]"
);


const del =
event.target.closest(
"[data-delete]"
);


if(edit){

editTrade(
edit.dataset.edit
);

}


if(del){

deleteTrade(
del.dataset.delete
);

}

}
);


/* BACKUP */

document
.getElementById(
"backupButton"
)
.addEventListener(
"click",
createBackup
);


/* APAGAR TODOS */

document
.getElementById(
"deleteAllButton"
)
.addEventListener(
"click",
deleteAll
);


/* ==============================
   PWA
============================== */

let deferredPrompt = null;


window.addEventListener(
"beforeinstallprompt",
function(event){

event.preventDefault();

deferredPrompt = event;


const button =
document.getElementById(
"installButton"
);


button.style.display =
"block";


button.onclick =
function(){

if(deferredPrompt){

deferredPrompt.prompt();

deferredPrompt = null;

}

};

}
);


/* ==============================
   INICIAR
============================== */

loadDatabase();

render();

</script>

</body>
</html>
